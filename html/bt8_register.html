    <table align="center" border="1" width="80%" bgcolor="yellow">
        <caption><h4>ĐĂNG KÝ THAM GIA DIỄN ĐÀN</h4></caption>
        <tr>
            <td><label>Tên đăng nhập:</label></td>
            <td><input type="text" placeholder="Nhập tên đăng nhập"></td>
        </tr>
        <tr>
            <td><label>Mật khẩu:</label></td>
            <td><input type="password"></td>
        </tr>
        <tr>
            <td><label>Giới tính: </label></td>
            <td><input type="radio">Nam <input type="radio">Nữ</td>
        </tr>
        <tr>
            <td><label>Ngày sinh:</label></td>
            <td><input type="date"></td>
        </tr>
        <tr>
            <td><label>Email:</label></td>
            <td><input type="email"></td>
        </tr>
        <tr>
            <td><label>Ngôn ngữ lập trình yêu thích nhất</label></td>
            <td>
                <select>
                    <option></option>
                    <option>C++</option>
                    <option>C#</option>
                    <option>PHP</option>
                    <option>Java</option>
                    <option>Python</option>
                </select>
            </td>
        </tr>
        <tr>
            <td align="center"><label">Quy định khi tham gia diễn đàn</label></td>
            <td><textarea rows="4">Bài viết phải nghiêm túc, không chứa quảng cáo, không có nội dung phản cảm</textarea></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button type="submit">
                    <image src="../images/register.png" alt="Đăng ký" width="80"></image>
                </button>
                <button type="reset">
                    <image src="../images/cancel.png" alt="Hủy" width="80"></image>
                </button>
            </td>
        </tr>
    </table>

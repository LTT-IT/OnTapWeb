<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - BT7</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        svg {
            display: block;
            margin-top: 10px; 
        }
    </style>
</head>
<body>
    
    <svg width="400" height="200">
        <text x="200" y="30" style="text-anchor: middle; font-size: 18; font-weight: bold;">
            Bài 1: Vẽ các hình cơ bản
        </text>
        <rect x="50" y="50" width="300" height="150"style="fill: rgb(255, 255, 255); stroke: lightgray; stroke-width: 2;"/>
        <rect x="60" y="60" width="280" height="130" style="fill: rgb(0, 81, 255)"></rect>
        <circle cx="200" cy="125" r="50" style="fill: rgb(255, 98, 0)"></circle>
        <line x1="60" y1="60" x2="340" y2="190" style="stroke: yellow; stroke-width: 5"></line>
    </svg>

    <svg width="400" height="400">
        <text x="200" y="30" style="text-anchor: middle; font-size: 18; font-weight: bold;">
            Bài 2: Vẽ ngôi nhà đơn giản
        </text>
        <rect x="50" y="50" width="300" height="200"
        style="fill: rgb(255, 255, 255); stroke: lightgray; stroke-width: 1;"/>
        <rect x="120" y="135" width="150" height="100" style="fill: rgb(141, 83, 26);"></rect>          
        <polygon points="195,60 100,135 290,135"
        style="fill:rgb(255, 157, 0);"></polygon>
        <rect x="140" y="160" width="40" height="40" style="fill: cyan; stroke: black; stroke-width: 2"></rect>
        <rect x="220" y="180" width="35" height="55" style="fill: rgb(66, 35, 4)"> </rect>
    </svg>
</body>
</html>
